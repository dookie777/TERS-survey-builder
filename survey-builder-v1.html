${'<'}script>
const RAW = ${dataStr};
const { title, cover, coverActive, questions, startGroupIndex } = RAW;

// ── 테마 초기화 ──
(function() {
  const html = document.documentElement;
  const icon = document.getElementById('deployThemeIcon');
  // html 태그에 이미 테마가 주입된 경우 그것을 우선 사용
  const isLight = html.getAttribute('data-theme') === 'light';
  if (isLight) {
    if (icon) icon.textContent = '☾';
  } else {
    if (icon) icon.textContent = '☀';
  }
  // 로고 처리
  applyDeployLogo(isLight);
})();

function applyDeployLogo(isLight) {
  const img = document.querySelector('.deploy-header-logo img');
  if (!img) return;
  if (isLight) {
    img.style.filter = 'invert(1)';
    img.style.mixBlendMode = 'normal';
  } else {
    img.style.filter = '';
    img.style.mixBlendMode = '';
  }
}

function toggleDeployTheme() {
  const html = document.documentElement;
  const icon = document.getElementById('deployThemeIcon');
  const isLight = html.getAttribute('data-theme') === 'light';
  if (isLight) {
    html.removeAttribute('data-theme');
    if (icon) icon.textContent = '☀';
    applyDeployLogo(false);
  } else {
    html.setAttribute('data-theme', 'light');
    if (icon) icon.textContent = '☾';
    applyDeployLogo(true);
  }
}

// -1 = 표지, 0~ = 섹션 그룹 인덱스
let groupIndex = -1;
const answers = {};
const keys = 'ABCDEFGHIJ';

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


function buildMediaHtml(m) {
  if (!m || !m.src) return '';
  const w = m.width || 80;
  const align = m.align || 'left';
  const jc = align === 'center' ? 'center' : align === 'right' ? 'flex-end' : 'flex-start';
  if (m.type === 'image') {
    return \`<div class="media-wrap" style="display:flex;justify-content:\${jc};">
      <img src="\${m.src}" style="width:\${w}%;display:block;border-radius:6px;">
    </div>\`;
  }
  return \`<div class="media-wrap" style="display:flex;justify-content:\${jc};">
    <div style="width:\${w}%;"><iframe src="\${m.src}" style="width:100%;aspect-ratio:16/9;border:none;border-radius:6px;" allowfullscreen></iframe></div>
  </div>\`;
}

// 섹션 그룹 계산 (섹션 구분선 기준으로 문항 인덱스 묶음)
function getSectionGroups() {
  const groups = [];
  let current = [];
  questions.forEach((q, i) => {
    if (q.type === '섹션') { groups.push(current); current = []; }
    else current.push(i);
  });
  groups.push(current);
  return groups.filter(g => g.length > 0);
}

function buildInputHtml(q, qi, isCentered) {
  if (q.type === '단답형') {
    const saved = answers[qi] || '';
    return \`<input class="ans-input" type="text" placeholder="답변을 입력하십시오" value="\${escHtml(saved)}"
      oninput="answers[\${qi}]=this.value">\`;
  }
  if (q.type === '장문형') {
    const saved = answers[qi] || '';
    return \`<textarea class="ans-textarea" placeholder="답변을 입력하십시오"
      oninput="answers[\${qi}]=this.value">\${escHtml(saved)}</textarea>\`;
  }
  if (q.type === '객관식') {
    const opts = q.shuffle ? [...q.options].sort(() => Math.random()-0.5) : q.options;
    const saved = answers[qi];
    return \`<div class="options-wrap">\${opts.map((opt, optIdx) => \`
      <div class="option-item\${saved===optIdx?' selected':''}" onclick="selectSingle(\${qi},\${optIdx},this)">
        <span class="option-key">\${keys[optIdx]}</span><span>\${escHtml(opt)||'옵션 '+(optIdx+1)}</span>
      </div>\`).join('')}</div>\`;
  }
  if (q.type === '체크박스') {
    const max = q.maxCheck || 0;
    const opts = q.shuffle ? [...q.options].sort(() => Math.random()-0.5) : q.options;
    const saved = answers[qi] || [];
    return \`\${max>0?\`<div class="max-hint">최대 \${max}개 선택 가능</div>\`:''}
      <div class="options-wrap">\${opts.map((opt, optIdx) => \`
        <div class="option-item\${saved.includes(optIdx)?' selected':''}" onclick="selectMulti(\${qi},\${optIdx},this,\${max})">
          <span class="option-key">\${keys[optIdx]}</span><span>\${escHtml(opt)||'옵션 '+(i+1)}</span>
        </div>\`).join('')}</div>\`;
  }
  if (q.type === '드롭다운') {
    const saved = answers[qi] ?? '';
    return \`<select class="ans-select" onchange="answers[\${qi}]=this.value; this.classList.toggle('answered', !!this.value);">
      <option value="" ${saved===''||saved==null?'selected':''}>선택하십시오</option>
      \${q.options.map((opt,i)=>\`<option value="\${i}"\${saved==i?' selected':''}>\${escHtml(opt)||'옵션 '+(i+1)}</option>\`).join('')}
    </select>\`;
  }
  if (q.type === '척도형') {
    const nums=[]; for(let i=q.scaleMin;i<=q.scaleMax;i++) nums.push(i);
    const saved=answers[qi]; const minLabel=q.scaleMinLabel||''; const maxLabel=q.scaleMaxLabel||''; const midLabel=q.scaleMidLabel||'';
    const hasRow=minLabel||maxLabel||midLabel;
    const total=nums.length; const isOdd=total%2===1; const midIdx=Math.floor((total-1)/2);
    return \`<div class="scale-wrap" id="scaleWrap_\${qi}">
      <div class="scale-selected-label" id="scaleLabel_\${qi}"></div>
      <div class="scale-dots" id="scaleDots_\${qi}">\${nums.map((n,i)=>{
        const isMin=i===0; const isMax=i===total-1; const isMid=isOdd&&i===midIdx;
        let tipText='';
        if(isMin&&minLabel) tipText=minLabel;
        if(isMid&&midLabel) tipText=midLabel;
        if(isMax&&maxLabel) tipText=maxLabel;
        const tipHtml=tipText
          ? \`<div class="scale-tooltip"><strong style="color:#fff;">\${n}점</strong><br><span style="color:#ccc;">\${escHtml(tipText)}</span></div>\`
          : \`<div class="scale-tooltip"><strong style="color:#fff;">\${n}점</strong></div>\`;
        return \`<div class="scale-dot-wrap" data-idx="\${i}" onclick="toggleScaleTip(this)">\`
          +\`<div class="scale-dot\${saved===n?' selected':''}" onclick="selectScale(\${qi},\${n},this);event.stopPropagation();">\${n}</div>\`
          +tipHtml+\`</div>\`;
      }).join('')}</div>
      \${hasRow?\`<div class="scale-ends-row" id="scaleRow_\${qi}"><span class="lbl-min">\${escHtml(minLabel)}</span><span class="lbl-mid">\${escHtml(midLabel)}</span><span class="lbl-max">\${escHtml(maxLabel)}</span></div>\`:''}
    </div>\`;
  }
  if (q.type === '행렬형') {
    const nums=[]; for(let i=q.scaleMin;i<=q.scaleMax;i++) nums.push(i);
    const rows=q.rows||[]; const saved=answers[qi]||{};
    const minLabel=q.scaleMinLabel||''; const maxLabel=q.scaleMaxLabel||''; const midLabel=q.scaleMidLabel||'';
    const hasLabel=minLabel||maxLabel||midLabel;
    const total=nums.length; const isOdd=total%2===1; const midIdx=Math.floor((total-1)/2);
    return \`<div class="matrix-wrap">\${rows.map((row,ri)=>\`
      <div class="matrix-row\${saved[ri]!=null?' active':''}" id="mRow_\${qi}_\${ri}" onclick="toggleMatrix(\${qi},\${ri})">
        <div class="matrix-row-label">
          <span class="matrix-row-num">\${ri+1}</span>
          <span class="matrix-row-text">\${escHtml(row)||'항목 '+(ri+1)}</span>
          <span class="matrix-row-selected" id="mSel_\${qi}_\${ri}">\${saved[ri]!=null?saved[ri]+'점':''}</span>
        </div>
        <div class="matrix-scale-popup\${ri===0&&saved[ri]==null?' open':''}" id="mPopup_\${qi}_\${ri}">
          <div class="matrix-scale-selected-label" id="mScaleLbl_\${qi}_\${ri}"></div><div class="matrix-scale-dots" id="mDots_\${qi}_\${ri}">\${nums.map((n,ni)=>{
            const isMin=ni===0; const isMax=ni===total-1; const isMid=isOdd&&ni===midIdx;
            let tipText='';
            if(isMin&&minLabel) tipText=minLabel;
            if(isMid&&midLabel) tipText=midLabel;
            if(isMax&&maxLabel) tipText=maxLabel;
            const tipHtml=tipText
              ? \`<div class="scale-tooltip"><strong style="color:#fff;">\${n}점</strong><br><span style="color:#ccc;">\${escHtml(tipText)}</span></div>\`
              : \`<div class="scale-tooltip"><strong style="color:#fff;">\${n}점</strong></div>\`;
            return \`<div class="scale-dot-wrap" data-idx="\${ni}">\`
              +\`<div class="scale-dot\${saved[ri]===n?' selected':''}" onclick="selectMatrixVal(event,\${qi},\${ri},\${n})">\${n}</div>\`
              +tipHtml+\`</div>\`;
          }).join('')}</div>
          \${hasLabel?\`<div class="matrix-ends-row" id="mRow_lbl_\${qi}_\${ri}"><span class="lbl-min">\${escHtml(minLabel)}</span><span class="lbl-mid">\${escHtml(midLabel)}</span><span class="lbl-max">\${escHtml(maxLabel)}</span></div>\`:''}
        </div>
      </div>\`).join('')}</div>\`;
  }
  return '';
}

function renderPage() {
  const wrap = document.getElementById('surveyWrap');
  const groups = getSectionGroups();

  // 헤더 제목 설정
  const deployTitleEl = document.getElementById('deployTitle');
  if (deployTitleEl && cover && cover.title) {
    const tmp = document.createElement('div');
    tmp.innerHTML = cover.title;
    deployTitleEl.textContent = tmp.textContent || tmp.innerText || '';
  }

  // 제출 완료
  if (groupIndex >= groups.length) {
    const isEarlyEnd = window._earlyEnd === true;
    wrap.innerHTML = \`<div class="submit-wrap">
      <div class="submit-icon">\${isEarlyEnd ? '✕' : '✓'}</div>
      <div class="submit-title">\${isEarlyEnd ? '설문이 종료되었습니다' : '제출이 완료되었습니다'}</div>
      <div class="submit-desc">\${isEarlyEnd ? '조건에 해당되지 않아 설문이 종료됩니다.' : '응답해 주셔서 감사합니다'}</div>
    </div>\`;
    return;
  }

  // 표지
  if (groupIndex < 0) {
    const hasLogo = cover.logo && cover.logo.src;
    const logoPos = cover.logoPosition || 'above';
    const logoEl = hasLogo ? buildMediaHtml(cover.logo) : '';
    const titleEl = cover.title ? \`<div class="cover-preview-title ql-editor">\${cover.title}</div>\` : '';
    const subtitleEl = cover.subtitle ? \`<div class="cover-preview-subtitle ql-editor">\${cover.subtitle}</div>\` : '';
    const blocksEl = cover.blocks.map(blk => {
      if (blk.type==='text') return blk.content?\`<div class="cover-preview-block-text ql-editor">\${blk.content}</div>\`:'';
      return blk.media&&blk.media.src?buildMediaHtml(blk.media):'';
    }).join('');
    wrap.innerHTML = \`<div class="cover-wrap">
      \${logoPos==='above'?logoEl:''}\${titleEl}\${subtitleEl}\${logoPos==='below'?logoEl:''}\${blocksEl}
      <div style="margin-top:32px;display:flex;justify-content:center;">
        <button class="btn-next cover-btn" onclick="nextPage()">
          \${escHtml(cover.startLabel||'설문 시작')}<span class="key-hint">Enter ↵</span>
        </button>
      </div>
    </div>\`;
    return;
  }

  const curGroup = groups[groupIndex];

  // 섹션 제목 찾기 (그룹 첫 문항 바로 앞의 섹션 구분선)
  const firstQIdx = curGroup[0];
  let sectionTitle = '';
  for (let i = firstQIdx - 1; i >= 0; i--) {
    if (questions[i].type === '섹션') { sectionTitle = questions[i].text || ''; break; }
    break;
  }

  // 문항 번호 계산 (섹션 구분선 제외)
  let qNumBefore = 0;
  questions.forEach((q, i) => { if (q.type !== '섹션' && i < firstQIdx) qNumBefore++; });

  const questionsHTML = curGroup.map((qi, localIdx) => {
    const q = questions[qi];
    const qNum = qNumBefore + localIdx + 1;
    const mediaAbove = q.media&&q.media.src&&(q.mediaPosition||'below')==='above'?buildMediaHtml(q.media):'';
    const mediaBelow = q.media&&q.media.src&&(q.mediaPosition||'below')==='below'?buildMediaHtml(q.media):'';
    return \`<div class="q-wrap" id="qBlock_\${qi}" style="margin-bottom:40px;padding-bottom:40px;border-bottom:1px solid var(--border);\${(q.text||'').includes('ql-align-center')?'align-items:center;':''}">
      <div class="q-meta">Q\${qNum} · \${q.type==='체크박스'?'체크박스(다중 선택)':q.type==='객관식'?'객관식(단일 선택)':q.type}\${q.required?'<span class="q-required-mark">* 필수 응답</span>':''}</div>
      \${mediaAbove}
      <div class="q-text ql-editor">\${q.text||'<span style="opacity:0.3">(질문 없음)</span>'}</div>
      \${q.description?\`<div class="q-desc ql-editor">\${q.description}</div>\`:''}
      \${mediaBelow}
      <div style="margin-bottom:16px;"></div>
      \${buildInputHtml(q, qi, (q.text||'').includes('ql-align-center'))}
      <div class="required-error" id="reqErr_\${qi}">필수 응답 문항입니다.</div>
    </div>\`;
  }).join('');

  const isLast = groupIndex === groups.length - 1;
  const isFirst = groupIndex === 0;
  const totalGroups = groups.length;
  const currentNum = groupIndex + 1;
  const progressPct = (currentNum / totalGroups) * 100;

  const prevBtn = !isFirst ? \`
    <button class="btn-prev" onclick="prevPage()">
      <svg width="96" height="56" viewBox="0 0 96 56">
        <path d="M24,6 Q19,6 17,9 L5,25 Q2,28 5,31 L17,47 Q19,50 24,50 L86,50 Q91,50 91,45 L91,11 Q91,6 86,6 Z" fill="rgba(128,128,128,0.15)"/>
        <text x="55" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#888888" font-family="Noto Sans KR, sans-serif">이전</text>
      </svg>
    </button>\` : \`<div style="width:96px;"></div>\`;

  const theme = document.documentElement.getAttribute('data-theme');
  const defaultBtnColor = theme === 'light' ? '#111111' : '#ffffff';
  const defaultBtnText = theme === 'light' ? '#ffffff' : '#0a0a0a';
  const nextColor = isLast ? '#b83060' : defaultBtnColor;
  const nextTextColor = isLast ? '#ffffff' : defaultBtnText;
  const nextLabel = isLast ? '제출' : '다음';

  const nextBtn = \`
    <button class="btn-next" onclick="nextPage()">
      <svg width="96" height="56" viewBox="0 0 96 56">
        <path d="M10,6 Q5,6 5,11 L5,45 Q5,50 10,50 L72,50 Q77,50 79,47 L91,31 Q94,28 91,25 L79,9 Q77,6 72,6 Z" fill="\${nextColor}"/>
        <text x="41" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="\${nextTextColor}" font-family="Noto Sans KR, sans-serif">\${nextLabel}</text>
      </svg>
    </button>\`;

  wrap.innerHTML = \`
    \${sectionTitle?\`<div style="padding:0;font-size:0.9rem;font-weight:700;color:var(--text-muted);margin-bottom:28px;padding-bottom:12px;border-bottom:1px solid var(--border);">\${(function(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent||d.innerText||''})(sectionTitle)}</div>\`:''}
    \${questionsHTML}
    <div class="cta-wrap">
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:\${progressPct}%"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        \${prevBtn}
        <span class="cta-num">\${currentNum} / \${totalGroups}</span>
        \${nextBtn}
      </div>
    </div>\`;

  window.scrollTo({ top: 0, behavior: 'smooth' });
  requestAnimationFrame(() => { requestAnimationFrame(() => {
    calcScaleWidth();
    calcMatrixWidth();
    document.querySelectorAll('.scale-dot-wrap').forEach(wrap => {
      wrap.addEventListener('mouseenter', () => positionTooltip(wrap));
    });
    document.querySelectorAll('.matrix-scale-popup.open .scale-dot-wrap').forEach(wrap => {
      wrap.addEventListener('mouseenter', () => positionTooltip(wrap));
    });
    applyPipingToDOM();
    setTimeout(applyPipingToDOM, 50);
  }); });
}

function calcScaleWidth() {
  document.querySelectorAll('[id^="scaleWrap_"]').forEach(wrap => {
    const id = wrap.id.replace('scaleWrap_', '');
    const dotsEl = document.getElementById('scaleDots_' + id);
    const row = document.getElementById('scaleRow_' + id);
    if (!dotsEl || !row) return;
    const wraps = dotsEl.querySelectorAll('.scale-dot-wrap');
    const total = wraps.length;
    if (total < 3) return;
    const isOdd = total % 2 === 1;
    const dots = Array.from(wraps).map(w => w.querySelector('.scale-dot').getBoundingClientRect());
    const containerRect = dotsEl.getBoundingClientRect();
    if (containerRect.width === 0) return;
    row.style.width = containerRect.width + 'px';
    const minRight = dots[1].right;
    const maxLeft  = dots[total - 2].left;
    let midLeft, midRight;
    if (isOdd) { const mid = Math.floor(total / 2); midLeft = dots[mid-1].right; midRight = dots[mid+1].left; }
    else { midLeft = dots[total/2-1].left; midRight = dots[total/2].right; }
    const lblMin = row.querySelector('.lbl-min');
    const lblMid = row.querySelector('.lbl-mid');
    const lblMax = row.querySelector('.lbl-max');
    const minMaxW = minRight - containerRect.left;
    const maxMaxW = containerRect.right - maxLeft;
    const midFullW = midRight - midLeft;
    const midCenterPx = midLeft - containerRect.left + midFullW / 2;
    const midAvailLeft = midCenterPx; const midAvailRight = containerRect.width - midCenterPx; const midMaxW = Math.min(midAvailLeft, midAvailRight) * 2 * 0.9;
    if (lblMin) lblMin.style.maxWidth = Math.max(40, minMaxW) + 'px';
    if (lblMid) { lblMid.style.width = Math.max(40, midMaxW) + 'px'; lblMid.style.maxWidth = Math.max(40, midMaxW) + 'px'; lblMid.style.left = Math.max(0, midCenterPx - midMaxW / 2) + 'px'; }
    if (lblMax) lblMax.style.maxWidth = Math.max(40, maxMaxW) + 'px';
    requestAnimationFrame(() => {
      const heights = [lblMin, lblMid, lblMax].filter(Boolean).map(el => el.offsetHeight);
      row.style.height = Math.max(...heights) + 'px';
    });
    // 툴팁 max-width
    const leftAdjIdx  = Math.floor((total-1)/2) - (total%2===0?0:1);
    const rightAdjIdx = Math.floor((total-1)/2) + 1;
    if (total >= 3) {
      const leftAdjRight = wraps[leftAdjIdx].getBoundingClientRect().right;
      const rightAdjLeft = wraps[rightAdjIdx].getBoundingClientRect().left;
      const firstLeft = wraps[0].getBoundingClientRect().left;
      const lastRight = wraps[total-1].getBoundingClientRect().right;
      const firstTip = wraps[0].querySelector('.scale-tooltip');
      const lastTip  = wraps[total-1].querySelector('.scale-tooltip');
      if (firstTip) firstTip.style.maxWidth = Math.max(80, leftAdjRight - firstLeft - 4) + 'px';
      if (lastTip)  lastTip.style.maxWidth  = Math.max(80, lastRight - rightAdjLeft - 4) + 'px';
      if (isOdd) {
        const mid = Math.floor(total/2);
        const midTip = wraps[mid].querySelector('.scale-tooltip');
        if (midTip) midTip.style.maxWidth = Math.max(80, midRight - midLeft - 4) + 'px';
      }
    }
  });
}

function calcMatrixWidth() {
  document.querySelectorAll('.matrix-scale-popup.open').forEach(popup => {
    const dotsEl = popup.querySelector('[id^="mDots_"]');
    const row = popup.querySelector('.matrix-ends-row');
    if (!dotsEl) return;
    const wraps = dotsEl.querySelectorAll('.scale-dot-wrap');
    const total = wraps.length;
    if (total < 3) return;
    const isOdd = total % 2 === 1;
    const dots = Array.from(wraps).map(w => w.querySelector('.scale-dot').getBoundingClientRect());
    const containerRect = dotsEl.getBoundingClientRect();
    if (containerRect.width === 0) { setTimeout(() => calcMatrixWidth(), 50); return; }
    const minRight = dots[1].right;
    const maxLeft  = dots[total - 2].left;
    let midLeft, midRight;
    if (isOdd) { const mid = Math.floor(total/2); midLeft = dots[mid-1].right; midRight = dots[mid+1].left; }
    else { const leftMid = total/2-1; const rightMid = total/2; midLeft = dots[leftMid].left; midRight = dots[rightMid].right; }
    if (row) {
      const lblMin = row.querySelector('.lbl-min');
      const lblMid = row.querySelector('.lbl-mid');
      const lblMax = row.querySelector('.lbl-max');
      const minMaxW = minRight - containerRect.left;
      const maxMaxW = containerRect.right - maxLeft;
      const midFullW = midRight - midLeft;
      const midCenterPx = midLeft - containerRect.left + midFullW / 2;
      const midAvailLeft = midCenterPx; const midAvailRight = containerRect.width - midCenterPx; const midMaxW = Math.min(midAvailLeft, midAvailRight) * 2 * 0.9;
      row.style.width = containerRect.width + 'px';
      if (lblMin) { lblMin.style.maxWidth = Math.max(40, minMaxW) + 'px'; }
      if (lblMid) { lblMid.style.width = Math.max(40, midMaxW) + 'px'; lblMid.style.maxWidth = Math.max(40, midMaxW) + 'px'; lblMid.style.left = Math.max(0, midCenterPx - midMaxW / 2) + 'px'; }
      if (lblMax) { lblMax.style.maxWidth = Math.max(40, maxMaxW) + 'px'; }
      requestAnimationFrame(() => {
        const heights = [lblMin, lblMid, lblMax].filter(Boolean).map(el => el.offsetHeight);
        row.style.height = Math.max(...heights) + 'px';
      });
    }
    // 툴팁 max-width
    const leftAdjIdx  = Math.floor((total-1)/2) - (total%2===0?0:1);
    const rightAdjIdx = Math.floor((total-1)/2) + 1;
    if (total >= 3) {
      const leftAdjRight = wraps[leftAdjIdx].getBoundingClientRect().right;
      const rightAdjLeft = wraps[rightAdjIdx].getBoundingClientRect().left;
      const firstLeft = wraps[0].getBoundingClientRect().left;
      const lastRight = wraps[total-1].getBoundingClientRect().right;
      const firstTip = wraps[0].querySelector('.scale-tooltip');
      const lastTip  = wraps[total-1].querySelector('.scale-tooltip');
      if (firstTip) firstTip.style.maxWidth = Math.max(80, leftAdjRight - firstLeft - 4) + 'px';
      if (lastTip)  lastTip.style.maxWidth  = Math.max(80, lastRight - rightAdjLeft - 4) + 'px';
      if (isOdd) {
        const mid = Math.floor(total/2);
        const midTip = wraps[mid].querySelector('.scale-tooltip');
        if (midTip) midTip.style.maxWidth = Math.max(80, midRight - midLeft - 4) + 'px';
      }
    }
    // 팝업 열릴 때 툴팁 이벤트 바인딩
    wraps.forEach(wrap => {
      wrap.onmouseenter = () => positionTooltip(wrap);
    });
  });
}

function selectSingle(qi, idx, el) {
  answers[qi] = idx;
  el.closest('.options-wrap').querySelectorAll('.option-item').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

function selectMulti(qi, idx, el, max) {
  if (!answers[qi]) answers[qi] = [];
  const arr = answers[qi];
  const pos = arr.indexOf(idx);
  if (pos >= 0) { arr.splice(pos, 1); el.classList.remove('selected'); }
  else { if (max > 0 && arr.length >= max) return; arr.push(idx); el.classList.add('selected'); }
}

function selectScale(qi, val, el) {
  answers[qi] = val;
  el.closest('.scale-dots').querySelectorAll('.scale-dot').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  el.closest('.scale-dots').querySelectorAll('.scale-dot-wrap').forEach(w => w.classList.remove('show-tooltip'));
  // 모바일 선택값 레이블 업데이트
  const lbl = document.getElementById('scaleLabel_'+qi);
  if (lbl) {
    const wrap = el.closest('.scale-wrap');
    const dot = el;
    const allDots = el.closest('.scale-dots').querySelectorAll('.scale-dot');
    const total = allDots.length;
    const idx = Array.from(allDots).indexOf(dot);
    const tip = dot.closest('.scale-dot-wrap') && dot.closest('.scale-dot-wrap').querySelector('.scale-tooltip');
    const tipSpan = tip ? tip.querySelector('span') : null;
    lbl.textContent = tipSpan ? tipSpan.textContent : '';
  }
}

function toggleScaleTip(wrap) {
  const isShowing = wrap.classList.contains('show-tooltip');
  const dotsEl = wrap.closest('.scale-dots');
  if (dotsEl) dotsEl.querySelectorAll('.scale-dot-wrap').forEach(w => w.classList.remove('show-tooltip'));
  if (!isShowing) { wrap.classList.add('show-tooltip'); positionTooltip(wrap); }
}

function positionTooltip(wrap) {
  const tooltip = wrap.querySelector('.scale-tooltip');
  if (!tooltip) return;
  const dotEl = wrap.querySelector('.scale-dot');
  if (!dotEl) return;
  const dotRect = dotEl.getBoundingClientRect();
  tooltip.style.opacity = '0';
  tooltip.style.left = '0px';
  tooltip.style.top  = '0px';
  requestAnimationFrame(() => {
    const tipW = tooltip.offsetWidth || 120;
    let left = dotRect.left + dotRect.width / 2 - tipW / 2;
    const top  = dotRect.bottom + 10;
    if (left < 8) left = 8;
    if (left + tipW > window.innerWidth - 8) left = window.innerWidth - tipW - 8;
    tooltip.style.left = left + 'px';
    tooltip.style.top  = top + 'px';
    tooltip.style.opacity = '';
    const arrowLeft = dotRect.left + dotRect.width / 2 - left;
    tooltip.style.setProperty('--arrow-left', arrowLeft + 'px');
  });
}

function toggleMatrix(qi, ri) {
  const popup = document.getElementById('mPopup_'+qi+'_'+ri);

function isAnswered(q, qi) {
  if (!q.required) return true;
  const a = answers[qi];
  if (q.type==='단답형'||q.type==='장문형') return a && a.trim()!=='';
  if (q.type==='객관식') return a != null;
  if (q.type==='체크박스') return a && a.length > 0;
  if (q.type==='드롭다운') return a != null && a !== '';
  if (q.type==='척도형') return a != null;
  if (q.type==='행렬형') return (q.rows||[]).every((_,ri) => a && a[ri] != null);
  return true;
}

function nextPage() {
  const groups = getSectionGroups();
  if (groupIndex >= 0) {
    const curGroup = groups[groupIndex];
    for (const qi of curGroup) {
      const q = questions[qi];
      if (!isAnswered(q, qi)) {
        const err = document.getElementById('reqErr_'+qi);
        if (err) { err.classList.add('show'); setTimeout(() => err.classList.remove('show'), 2500); }
        const block = document.getElementById('qBlock_'+qi);
        if (block) block.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
    }
    // 로직 평가
    const logicResult = evaluateLogic(groups);
    if (logicResult === 'end') {
      window._earlyEnd = true;
      groupIndex = groups.length;
      renderPage();
      return;
    }
    if (logicResult && logicResult.indexOf('jump:') === 0) {
      const targetQIdx = parseInt(logicResult.split(':')[1]);
      for (let gi = 0; gi < groups.length; gi++) {
        if (groups[gi].some(function(qi) { return qi >= targetQIdx; })) {
          groupIndex = gi;
          renderPage();
          return;
        }
      }
    }
  }
  // 마지막 섹션이면 모달 표시
  if (groupIndex === groups.length - 1) {
    document.getElementById('submitModal').classList.add('open');
    return;
  }
  groupIndex++;
  renderPage();
}

function closeSubmitModal() {
  document.getElementById('submitModal').classList.remove('open');
}

function confirmSubmit() {
  closeSubmitModal();
  const groups = getSectionGroups();
  groupIndex = groups.length;
  if (RAW.appsScriptUrl && RAW.surveyId) {
    submitToGoogleSheets();
  }
  renderPage();
}

function prevPage() {
  if (groupIndex <= 0) return;
  groupIndex--;
  renderPage();
}

function submitToGoogleSheets() {
  const realQuestions = questions.filter(q => q.type !== '섹션');
  const answersPayload = {};
  realQuestions.forEach((q, i) => {
    const qi = questions.indexOf(q);
    answersPayload[qi] = {
      questionId: 'Q' + (i + 1),
      text: q.text ? q.text.replace(/<[^>]+>/g, '') : '(질문 없음)',
      answer: answers[qi] ?? null
    };
  });
  fetch(RAW.appsScriptUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      surveyId: RAW.surveyId,
      surveyTitle: RAW.title || '새 설문지',
      answers: answersPayload
    })
  }).catch(() => {}); // no-cors이므로 응답 확인 불가, 에러 무시
}

document.addEventListener('keydown', e => {
  if (e.key==='Enter' && e.target.tagName!=='TEXTAREA' && e.target.tagName!=='SELECT') nextPage();
});

// 로고 검은 배경 투명 처리
(function() {
  const img = document.querySelector('.deploy-header-logo img');
  if (!img) return;
  function processLogo() {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = data.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2];
      // 검은색에 가까운 픽셀 투명 처리 (밝기 기준)
      const brightness = (r + g + b) / 3;
      if (brightness < 40) {
        d[i+3] = 0;
      } else if (brightness < 80) {
        d[i+3] = Math.round((brightness - 40) / 40 * 255);
      }
    }
    ctx.putImageData(data, 0, 0);
    img.src = canvas.toDataURL('image/png');
  }
  if (img.complete && img.naturalWidth > 0) {
    processLogo();
  } else {
    img.onload = processLogo;
  }
})();

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function applyPiping(text) {
  if (!text) return text;
  const realQs = [];
  questions.forEach(function(q, i) { if (q.type !== '섹션') realQs.push({ q: q, qi: i }); });
  return text.replace(/\{Q(\d+)\}/g, function(match, num) {
    const target = realQs[parseInt(num) - 1];
    if (!target) return match;
    const a = answers[target.qi];
    if (a == null || a === '') return match;
    if (typeof a === 'string') return escHtml(a);
    if ((target.q.type === '객관식' || target.q.type === '드롭다운') && typeof a === 'number') return escHtml(target.q.options[a] || match);
    if (target.q.type === '체크박스' && Array.isArray(a)) return escHtml(a.map(function(i) { return target.q.options[i]; }).filter(Boolean).join(', '));
    if (target.q.type === '척도형' && typeof a === 'number') return String(a);
    return match;
  });
}

function applyPipingToDOM() {
  var realQs = [];
  questions.forEach(function(q, i) { if (q.type !== '섹션') realQs.push({ q: q, qi: i }); });
  function getReplacedValue(match, num) {
    var target = realQs[parseInt(num) - 1];
    if (!target) return null;
    var a = answers[target.qi];
    if (a == null || a === '') return null;
    if ((target.q.type === '객관식' || target.q.type === '드롭다운') && (typeof a === 'number' || (typeof a === 'string' && a !== '' && !isNaN(a)))) return target.q.options[parseInt(a)] || null;
    if (typeof a === 'string') return a;
    if (target.q.type === '체크박스' && Array.isArray(a)) return a.map(function(i) { return target.q.options[i]; }).filter(Boolean).join(', ');
    if (target.q.type === '척도형' && typeof a === 'number') return String(a);
    return null;
  }
  function replaceInnerHTML(el) {
    var html = el.innerHTML;
    var newHtml = html.replace(/\\{Q(\\d+)\\}/g, function(match, num) {
      var val = getReplacedValue(match, num);
      if (val === null) return match;
      return '<span style="color:var(--accent-select);text-decoration:underline;">' + val + '</span>';
    });
    if (newHtml !== html) el.innerHTML = newHtml;
  }
  Array.from(document.querySelectorAll('.q-text, .q-desc')).forEach(replaceInnerHTML);
}

function evaluateLogic(groups) {

        var rval = Number(rule.value);
        var match = (rule.condition === 'lte' && a <= rval) || (rule.condition === 'gte' && a >= rval) || (rule.condition === 'eq' && a === rval);

  }

  // ── Escape HTML ──
  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
