<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE EROOM SPORTS — 설문 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary:    #0a0a0a;
    --bg-secondary:  #111111;
    --bg-tertiary:   #1a1a1a;
    --bg-card:       #141414;
    --accent:        #ffffff;
    --accent-mid:    #d0d0d0;
    --accent-light:  #c8c8c8;
    --text-primary:  #f0f0f0;
    --text-secondary:#c8c8c8;
    --text-muted:    #888888;
    --border:        rgba(255,255,255,0.07);
    --border-accent: rgba(255,255,255,0.25);
    --radius-sm:     4px;
    --radius-md:     8px;
    --radius-lg:     12px;
    --font-display:  'Bebas Neue', sans-serif;
    --font-body:     'Noto Sans KR', sans-serif;
  }
  [data-theme="light"] {
    --bg-primary:    #f5f5f5;
    --bg-secondary:  #ffffff;
    --bg-tertiary:   #ebebeb;
    --bg-card:       #ffffff;
    --accent:        #0a0a0a;
    --accent-mid:    #333333;
    --accent-light:  #444444;
    --text-primary:  #0a0a0a;
    --text-secondary:#333333;
    --text-muted:    #888888;
    --border:        rgba(0,0,0,0.08);
    --border-accent: rgba(0,0,0,0.25);
  }
  [data-theme="light"] .header-logo img { mix-blend-mode: normal; filter: invert(1); }
  [data-theme="light"] .btn-new { background: #0a0a0a; color: #ffffff; }
  [data-theme="light"] .btn-new:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  /* Header */
  :root { --header-h: 62px; }
  .header {
    height: var(--header-h);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
    z-index: 100;
    position: sticky;
    top: 0;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .header-logo img { height: 44px; width: auto; mix-blend-mode: screen; }
  .header-divider { width: 1px; height: 28px; background: var(--border); }
  .header-tool-name {
    font-family: var(--font-display);
    font-size: 1.1rem;
    letter-spacing: 3px;
    color: var(--text-secondary);
  }
  .header-badge {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-muted);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 3px 8px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .btn-new {
    height: 34px; padding: 0 18px;
    background: var(--accent); border: none; border-radius: var(--radius-sm);
    color: #0a0a0a; font-family: var(--font-body); font-size: 0.82rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-new:hover { box-shadow: 0 4px 20px rgba(255,255,255,0.25); transform: translateY(-1px); }
  .btn {
    height: 34px; padding: 0 14px;
    border-radius: var(--radius-sm); font-family: var(--font-body);
    font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-ghost {
    background: transparent; color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--border-accent); color: var(--text-primary); }
  .btn-theme-toggle {
    width: 34px; height: 34px; padding: 0;
    font-size: 1rem; flex-shrink: 0;
  }

  /* Content */
  .content { max-width: 1100px; margin: 0 auto; padding: 40px 28px; }
  .content-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .content-title { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
  .content-count { font-size: 0.82rem; color: var(--text-muted); margin-left: 8px; }

  /* Empty */
  .empty-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 0; color: var(--text-muted);
  }
  .empty-icon { font-size: 2.5rem; margin-bottom: 16px; opacity: 0.3; }
  .empty-text { font-size: 0.9rem; }

  /* Survey Grid */
  .survey-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 1024px) {
    .survey-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .survey-grid { grid-template-columns: 1fr; }
    .content { padding: 24px 16px; }
  }

  /* Survey Card */
  .survey-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 26px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 18px;
    border-top-width: 3px;
  }
  .survey-card:hover { border-color: var(--border-accent); background: var(--bg-tertiary); }

  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); line-height: 1.4; word-break: keep-all; }
  .card-status {
    flex-shrink: 0;
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 20px;
  }
  .card-status.active { background: rgba(111,207,111,0.12); color: #6fcf6f; border: 1px solid rgba(111,207,111,0.25); }
  .card-status.closed { background: rgba(235,87,87,0.1); color: #eb9090; border: 1px solid rgba(235,87,87,0.3); }

  .card-meta {
    display: flex; gap: 16px;
  }
  .card-meta-item { display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .card-meta-label { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .card-meta-value { font-size: 0.88rem; font-weight: 600; color: var(--text-secondary); }
  .card-meta-value.response-count { color: var(--accent-mid); font-size: 0.88rem; }

  .card-footer {
    display: flex; gap: 8px; margin-top: 4px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .card-btn {
    flex: 1; height: 30px; border: 1px solid var(--border);
    background: transparent; border-radius: var(--radius-sm);
    color: var(--text-secondary); font-family: var(--font-body);
    font-size: 0.75rem; cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .card-btn:hover { border-color: var(--border-accent); color: var(--text-primary); background: rgba(255,255,255,0.04); }
  .card-btn.danger { border-color: rgba(235,87,87,0.3); color: #eb5757; }
  .card-btn.danger:hover { border-color: rgba(235,87,87,0.7); background: rgba(235,87,87,0.08); }
  .card-btn.primary { background: rgba(255,255,255,0.06); border-color: var(--border-accent); color: var(--text-primary); }

  /* 응답 수 로딩 */
  .response-loading { font-size: 0.75rem; color: var(--text-muted); }

  /* 확인 모달 */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-secondary); border: 1px solid var(--border-accent);
    border-radius: var(--radius-lg); padding: 28px; width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }
  .modal-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; }
  .modal-desc { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btn {
    flex: 1; height: 36px; border-radius: var(--radius-sm);
    font-family: var(--font-body); font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .modal-btn.cancel { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
  .modal-btn.cancel:hover { border-color: var(--border-accent); color: var(--text-primary); }
  .modal-btn.confirm { background: #eb5757; border: none; color: #fff; }
  .modal-btn.confirm:hover { background: #c0392b; }
  .site-footer { text-align: center; padding: 20px 16px; font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.03em; border-top: 1px solid var(--border); margin-top: auto; }
</style>
</head>

    <div class="header-divider"></div>
    <span class="header-tool-name">SURVEY BUILDER</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="btn btn-ghost btn-theme-toggle" id="themeBtn" onclick="toggleTheme()" title="테마 전환">☀</button>
    <button class="btn-new" onclick="newSurvey()">+ 새 설문 만들기</button>
  </div>
</header>

<div class="content">
  <div class="content-header">
    <div>
      <span class="content-title">내 설문</span>
      <span class="content-count" id="surveyCount"></span>
    </div>
  </div>
  <div id="surveyGrid" class="survey-grid"></div>
</div>

<!-- 종료 확인 모달 -->
<div class="modal-overlay" id="closeModal">
  <div class="modal">
    <div class="modal-title">설문을 종료하시겠습니까?</div>
    <div class="modal-desc">종료하면 배포된 링크에서 더 이상 응답을 수집하지 않습니다. 재개 버튼으로 다시 시작할 수 있습니다.</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeConfirmModal()">취소</button>
      <button class="modal-btn confirm" onclick="confirmClose()">종료</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkDHq31Q5ibih5fJhE_Q9vwd_zcoz25TJ34NyPpowphvlci3jlXsTR4RsjQXczpjWCtg/exec';

let pendingCloseId = null;

function getSurveys() {
  return JSON.parse(localStorage.getItem('surveys') || '{}');
}

function saveSurveys(surveys) {
  localStorage.setItem('surveys', JSON.stringify(surveys));
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return `${String(d.getFullYear()).slice(2)}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function newSurvey() {
  window.location.href = 'survey-builder-v1.html';
}

function editSurvey(id) {
  window.location.href = `survey-builder-v1.html?id=${id}`;
}

function openCloseModal(id, e) {
  e.stopPropagation();
  const surveys = getSurveys();
  const s = surveys[id];
  if (!s) return;
  if (s.status === 'closed') {
    // 재개
    s.status = 'active';
    s.closedAt = null;
    saveSurveys(surveys);
    renderList();
    return;
  }
  pendingCloseId = id;
  document.getElementById('closeModal').classList.add('open');
}

function closeConfirmModal() {
  pendingCloseId = null;
  document.getElementById('closeModal').classList.remove('open');
}

function confirmClose() {
  if (!pendingCloseId) return;
  const surveys = getSurveys();
  if (surveys[pendingCloseId]) {
    surveys[pendingCloseId].status = 'closed';
    surveys[pendingCloseId].closedAt = new Date().toISOString();
    saveSurveys(surveys);
  }
  closeConfirmModal();
  renderList();
}

function deleteSurvey(id, e) {
  e.stopPropagation();
  if (!confirm('이 설문을 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
  const surveys = getSurveys();
  delete surveys[id];
  saveSurveys(surveys);
  renderList();
}

async function fetchResponseCounts() {
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=counts', { mode: 'cors' });
    const data = await res.json();
    if (data.status === 'ok') return data.counts;
  } catch {}
  return {};
}

async function renderList() {
  const surveys = getSurveys();
  const grid = document.getElementById('surveyGrid');
  const keys = Object.keys(surveys).sort((a, b) =>
    new Date(surveys[b].updatedAt) - new Date(surveys[a].updatedAt)
  );

  document.getElementById('surveyCount').textContent = `전체 ${keys.length}개`;

  if (keys.length === 0) {
    grid.innerHTML = `<div class="empty-wrap" style="grid-column:1/-1;">
      <div class="empty-icon">◎</div>
      <div class="empty-text">아직 설문이 없습니다. 새 설문을 만들어 보십시오.</div>
    </div>`;
    return;
  }

  // 먼저 응답 수 없이 렌더
  grid.innerHTML = keys.map(id => {
    const s = surveys[id];
    const qCount = (s.questions || []).filter(q => q.type !== '섹션').length;
    const isActive = s.status !== 'closed';
    return `
      <div class="survey-card" style="border-top-color:${s.accentColor || 'rgba(255,255,255,0.25)'};" onclick="editSurvey('${id}')">
        <div class="card-header">
          <div class="card-title">${escHtml(s.title || '(제목 없음)')}</div>
          <div class="card-status ${isActive ? 'active' : 'closed'}">${isActive ? '진행 중' : '종료'}</div>
        </div>
        <div class="card-meta">
          <div class="card-meta-item">
            <span class="card-meta-label">생성일</span>
            <span class="card-meta-value">${formatDate(s.createdAt)}</span>
          </div>
          ${!isActive ? `
          <div class="card-meta-item">
            <span class="card-meta-label">종료일</span>
            <span class="card-meta-value">${formatDate(s.closedAt)}</span>
          </div>` : ''}
          <div class="card-meta-item">
            <span class="card-meta-label">문항 수</span>
            <span class="card-meta-value">${qCount}개</span>
          </div>
          <div class="card-meta-item">
            <span class="card-meta-label">응답 수</span>
            <span class="card-meta-value response-count" id="count_${id}">
              <span class="response-loading">불러오는 중...</span>
            </span>
          </div>
        </div>
        <div class="card-footer">
          <button class="card-btn primary" onclick="event.stopPropagation();editSurvey('${id}')">편집</button>
          <button class="card-btn" onclick="openCloseModal('${id}', event)">${isActive ? '종료' : '재개'}</button>
          <button class="card-btn" onclick="duplicateSurvey('${id}', event)">복제</button>
          <button class="card-btn danger" onclick="deleteSurvey('${id}', event)">삭제</button>
        </div>
      </div>`;
  }).join('');

  // 응답 수 비동기 로드
  const counts = await fetchResponseCounts();
  keys.forEach(id => {
    const s = surveys[id];
    const el = document.getElementById(`count_${id}`);
    if (!el) return;
    const title = s.title || '새 설문지';
    const count = counts[title] ?? '-';
    el.textContent = count === '-' ? '-' : `${count}명`;
  });
}

function toggleTheme() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  document.documentElement.setAttribute('data-theme', isLight ? '' : 'light');
  document.getElementById('themeBtn').textContent = isLight ? 'C' : '☀';
  localStorage.setItem('list-theme', isLight ? 'dark' : 'light');
}

function duplicateSurvey(id, e) {
  e.stopPropagation();
  const surveys = getSurveys();
  const src = surveys[id];
  if (!src) return;
  const baseTitle = (src.title || '새 설문지').replace(/의 사본\d*$/, '');
  let n = 1;
  const titles = Object.values(surveys).map(s => s.title || '');
  while (titles.includes(baseTitle + '의 사본' + n)) n++;
  const newId = 'survey_' + Date.now();
  const now = new Date().toISOString();
  surveys[newId] = Object.assign({}, JSON.parse(JSON.stringify(src)), {
    title: baseTitle + '의 사본' + n,
    createdAt: now,
    updatedAt: now,
    status: 'active',
    closedAt: null,
  });
  saveSurveys(surveys);
  renderList();
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 초기 테마 적용
(function() {
  const t = localStorage.getItem('list-theme');
  if (t === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeBtn').textContent = '☀';
  }
})();

// 초기 렌더
renderList();
</script>
